name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository and run checks. Nothing they do needs a
# writable token, so do not hand them one.
permissions:
  contents: read

# The five gates run as four jobs on separate runners, so the wall time is the
# slowest job rather than the sum. `quality` at the end is the one check the
# branch protection requires; it passes only when every job did.

jobs:
  checks:
    name: format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ESLint and tsc both keep a cache of what they last saw. Restored from
      # the newest run on the same lockfile, a source change re-lints and
      # re-checks only the files that changed.
      - name: Restore lint and typecheck caches
        uses: actions/cache@v4
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: checks-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            checks-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Prettier (format check)
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint --cache --cache-location .eslintcache

      # `next build` only typechecks what the build graph reaches. This covers
      # tests, unreferenced modules, and anything the bundler tree-shakes out.
      - name: Typecheck
        run: pnpm typecheck

  tests:
    name: tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest splits the file list in half; each runner takes one half.
      - name: Unit tests
        run: pnpm test --shard=${{ matrix.shard }}/2

  build:
    name: build, bundle budget, release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Next reuses this between runs for compilation and type information. The
      # key falls back to the newest cache for the same lockfile, so a source
      # change warm-starts instead of building from cold.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}

      # The JavaScript each route makes the browser load before it is
      # interactive, against the budgets in scripts/first-load-budget.json.
      # Fails on a breach, so a barrel import that drags a chart library into
      # the dashboard is caught here rather than by users.
      - name: First-load budget
        run: pnpm bundle:check

      - name: Release Notes Governance Gate
        run: bash scripts/check_release_notes.sh
        env:
          STRICT_RELEASE_NOTES: "true"

  # The required status check. It carries the name the branch protection
  # expects and reports the verdict of the jobs above; a skipped or failed
  # job fails it too, so a cancelled matrix leg cannot slip through.
  # No secret in source, proven on every pull request rather than asserted.
  # The config in .gitleaks.toml excludes test fixtures and vendored bundles,
  # which is what a scanner without it gets wrong. Whole history, because a
  # key that was committed and later removed is still leaked. The binary runs
  # from its own image rather than the marketplace action, which wants a
  # licence for organisation repos.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  quality:
    name: quality
    runs-on: ubuntu-latest
    needs: [checks, tests, build, secrets]
    if: always()
    steps:
      - name: Every gate passed
        run: |
          echo "checks=${{ needs.checks.result }} tests=${{ needs.tests.result }} build=${{ needs.build.result }}"
          test "${{ needs.checks.result }}" = "success" \
            && test "${{ needs.tests.result }}" = "success" \
            && test "${{ needs.build.result }}" = "success"
